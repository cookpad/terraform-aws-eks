permissions:
  id-token: write # This is required for requesting the JWT
  contents: read  # This is required for actions/checkout
on:
  pull_request:
    paths-ignore:
      - '*.md'
      - 'docs/**'

  push:
    paths-ignore:
      - '*.md'
      - 'docs/**'
    branches:
      - main
      - release-*
  schedule:
    - cron: "0 11 * * 1-5"
jobs:
  lint:
    name: Linting
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Terraform version
        id: terraform-version
        run: echo "version=$(cat .terraform-version)" >> $GITHUB_OUTPUT
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.terraform-version.outputs.version }}
      - name: 'Terraform Format'
        run: terraform fmt -check -recursive
      - name: 'Terraform Init cluster'
        run: terraform init
        working-directory: 'examples/cluster'
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: us-east-1
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          role-session-name: github-actions-ci
      - name: 'Terraform Validate cluster'
        run: terraform validate
        working-directory: 'examples/cluster'
  cluster-test:
    name: Test cluster module
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: us-east-1
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          role-session-name: github-actions-ci
      - name: 'Terratest'
        uses: ./.github/actions/terratest
        with:
          args: "-run TestTerraformAwsEksCluster"
